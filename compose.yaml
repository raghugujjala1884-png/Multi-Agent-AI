services:
  multi-agent:
    build: .
    container_name: multi-agent-ai

    ports:
      - "8000:8000"

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    volumes:
      - ./RAG/docs:/app/RAG/docs:ro
      - chroma_data:/app/RAG/vector_store
      - sqlite_data:/app/database

    stdin_open: true
    tty: true

    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  chroma_data:
  sqlite_data: